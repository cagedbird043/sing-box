name: Cagedbird Android APK

on:
  push:
    branches:
      - cagedbird/candidate-*
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'release/LDFLAGS'
      - 'release/DEFAULT_BUILD_TAGS_*'
      - 'scripts/ci/resolve-cagedbird-version.sh'
      - 'clients/android'
      - 'Makefile'
      - 'cmd/internal/build_libbox/**'
      - 'scripts/ci/build-android-apks.sh'
      - 'scripts/ci/android-gitlink-override'
      - '.github/workflows/cagedbird-android-apk.yml'
      - '.github/workflows/cagedbird-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for Android version name; use auto unless overriding."
        required: false
        default: auto
        type: string
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || 'auto' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/cagedbird-build.yml
    with:
      version: ${{ inputs.version || 'auto' }}
      artifacts: '["sing-box-cagedbird-android-apk"]'
    secrets: inherit
