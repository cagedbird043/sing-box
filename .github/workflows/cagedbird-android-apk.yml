name: Cagedbird Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for Android version name; use auto unless overriding."
        required: false
        default: auto
        type: string
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.version || 'auto' }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Android APK and AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.9
          cache: false
      - name: Go and gomobile cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/pkg/gomobile
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: android-go-gomobile-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'cmd/internal/build_libbox/**') }}-r28-v0.1.12
          restore-keys: |
            android-go-gomobile-${{ runner.os }}-
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: false
      - name: Setup OpenJDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('clients/android/**/*.gradle*', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build Android APKs
        run: scripts/ci/build-android-apks.sh
        env:
          CAGEDBIRD_VERSION: ${{ github.event.inputs.version || 'auto' }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          CAGEDBIRD_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.CAGEDBIRD_ANDROID_RELEASE_KEYSTORE_BASE64 }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-cagedbird-android-apk
          path: dist/cagedbird-android
          if-no-files-found: error
