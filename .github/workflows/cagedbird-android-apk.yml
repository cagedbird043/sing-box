name: Cagedbird Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for Android version name; use auto unless overriding."
        required: false
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Android APK and AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.9
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true
      - name: Setup OpenJDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('clients/android/**/*.gradle*', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build Android APKs
        run: scripts/ci/build-android-apks.sh
        env:
          CAGEDBIRD_VERSION: ${{ inputs.version }}
          CAGEDBIRD_ANDROID_APP_BRANCH: dev
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-cagedbird-android-apk
          path: dist/cagedbird-android
          if-no-files-found: error
