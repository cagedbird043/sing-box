name: Cagedbird Core

on:
  workflow_dispatch:
  push:
    branches:
      - cagedbird/alpha
      - cagedbird/**
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/cagedbird-*.yml'
  pull_request:
    branches:
      - cagedbird/alpha
      - cagedbird/**
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/cagedbird-*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-core:
    name: Provider core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
      - name: Check provider patch
        run: scripts/ci/test-provider-core.sh
